<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
    </header>

    <!-- Balance Display -->
    <div id="balance-display">
      <span class="balance-label">Total Balance</span>
      <span id="balance-amount">$0.00</span>
    </div>

    <!-- Transaction Input Form -->
    <section id="form-section">
      <h2>Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="field-group">
          <label for="item-name">Item Name</label>
          <input
            id="item-name"
            type="text"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
            required
          />
          <span class="error" id="error-item-name" aria-live="polite"></span>
        </div>
        <div class="field-group">
          <label for="amount">Amount</label>
          <input
            id="amount"
            type="number"
            step="0.01"
            min="0.01"
            placeholder="e.g. 12.50"
            required
          />
          <span class="error" id="error-amount" aria-live="polite"></span>
        </div>
        <div class="field-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error" id="error-category" aria-live="polite"></span>
        </div>
        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <!-- Transaction List -->
    <section id="transaction-list-section">
      <h2>Transactions</h2>
      <ul id="transaction-list">
        <!-- populated by renderList() -->
      </ul>
    </section>

    <!-- Spending Category Chart -->
    <section id="chart-section">
      <h2>Spending by Category</h2>
      <canvas id="spending-chart"></canvas>
      <p id="chart-placeholder" class="placeholder">No data to display</p>
    </section>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- Chart.js CDN (loaded before app.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
